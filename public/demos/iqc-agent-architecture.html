<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IQC智能体全景图</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:linear-gradient(160deg,#081c36 0%,#0d2c56 60%,#0a2344 100%);color:#e8f1ff;padding:26px 14px;min-height:100vh;}
  .wrap{max-width:1260px;margin:0 auto;}
  h1{font-size:23px;text-align:center;color:#fff;margin-bottom:2px;letter-spacing:1px;}
  .sub{text-align:center;color:#9cc2ee;font-size:13px;margin-bottom:14px;}
  .legend{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;font-size:12.5px;color:#cfe3f8;margin-bottom:12px;}
  .lg{display:flex;align-items:center;gap:6px;}
  .sw{width:26px;height:0;border-top:3px solid;}
  .dash{border-top-style:dashed;}
  .ai{background:#0ea5e9;color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:9px;}
  svg{width:100%;height:auto;display:block;}
</style>
</head>
<body>
<div class="wrap">
  <h1>IQC 智能体全景图</h1>
  <div class="sub">实线=现有运行 ｜ 虚线框=下一步进行 / 待接入（含 AI 功能，注 AI）</div>
  <div class="legend">
    <span class="lg"><span class="sw" style="border-color:#6ea8e0;"></span>主流程流向</span>
    <span class="lg"><span class="sw dash" style="border-color:#38bdf8;"></span>供给 / 反馈 / 回流</span>
    <span class="lg"><span class="ai">AI</span>AI 功能点（虚线=待接入）</span>
  </div>

<svg viewBox="0 0 1240 1060" xmlns="http://www.w3.org/2000/svg" font-family="Microsoft YaHei,PingFang SC,sans-serif">
  <defs>
    <marker id="mB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#6ea8e0"/></marker>
    <marker id="mL" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#38bdf8"/></marker>
    <marker id="mD" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#9cc2ee"/></marker>
  </defs>

  <!-- ===== 文件准备主链（现有·实线，透明描边） ===== -->
  <g font-size="14">
    <rect x="40" y="90" width="150" height="56" rx="10" fill="none" stroke="#6ea8e0" stroke-width="1.8"/>
    <text x="115" y="116" text-anchor="middle" font-weight="700" fill="#eaf3ff">客户要求</text>
    <text x="115" y="136" text-anchor="middle" font-size="11.5" fill="#9cc2ee">规格/标准/图纸要求</text>

    <rect x="225" y="90" width="150" height="56" rx="10" fill="none" stroke="#6ea8e0" stroke-width="1.8"/>
    <text x="300" y="116" text-anchor="middle" font-weight="700" fill="#eaf3ff">NPI 新产品导入</text>
    <text x="300" y="136" text-anchor="middle" font-size="11.5" fill="#9cc2ee">新物料/新供应商</text>

    <rect x="410" y="90" width="150" height="56" rx="10" fill="none" stroke="#6ea8e0" stroke-width="1.8"/>
    <text x="485" y="122" text-anchor="middle" font-weight="700" fill="#eaf3ff">图纸 / 技术文件</text>

    <rect x="595" y="90" width="155" height="56" rx="10" fill="none" stroke="#6ea8e0" stroke-width="1.8"/>
    <text x="672" y="116" text-anchor="middle" font-weight="700" fill="#eaf3ff">PEBS 工厂系统</text>
    <text x="672" y="136" text-anchor="middle" font-size="11.5" fill="#9cc2ee">文件流转 / 归档</text>

    <!-- 文控知识库 中枢（现有沉淀·实心深蓝） -->
    <rect x="990" y="82" width="215" height="72" rx="12" fill="#0f2547" stroke="#38bdf8" stroke-width="2"/>
    <text x="1097" y="112" text-anchor="middle" font-weight="700" fill="#fff" font-size="15">文控知识库（中枢）</text>
    <text x="1097" y="136" text-anchor="middle" font-size="11.5" fill="#b9d4f2">SIP·检验案例·清单·SPC·不良经验</text>
  </g>
  <g stroke="#6ea8e0" stroke-width="2.2" fill="none">
    <line x1="190" y1="118" x2="223" y2="118" marker-end="url(#mB)"/>
    <line x1="375" y1="118" x2="408" y2="118" marker-end="url(#mB)"/>
    <line x1="560" y1="118" x2="593" y2="118" marker-end="url(#mB)"/>
    <line x1="750" y1="118" x2="988" y2="118" marker-end="url(#mB)"/>
  </g>

  <!-- AI 文件评审：独立入口（待接入·虚线，透明） -->
  <g font-size="13.5">
    <rect x="40" y="205" width="200" height="68" rx="10" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="8 5"/>
    <rect x="48" y="213" width="34" height="16" rx="8" fill="#0ea5e9"/><text x="65" y="225" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">AI</text>
    <text x="145" y="230" text-anchor="middle" font-weight="700" fill="#eaf3ff">AI 文件评审（独立进入）</text>
    <text x="145" y="252" text-anchor="middle" font-size="11" fill="#9cc2ee">程序文件文法·ISO符合性·逻辑功能</text>
    <text x="145" y="268" text-anchor="middle" font-size="11" fill="#9cc2ee">评审结论生成改善建议</text>
  </g>
  <path d="M240,239 C520,239 760,180 988,128" stroke="#38bdf8" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#mL)"/>

  <!-- AI 生成 SIP（待接入·虚线，透明） -->
  <g font-size="13.5">
    <rect x="990" y="215" width="215" height="64" rx="10" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="8 5"/>
    <rect x="998" y="223" width="34" height="16" rx="8" fill="#0ea5e9"/><text x="1015" y="235" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">AI</text>
    <text x="1097" y="246" text-anchor="middle" font-weight="700" fill="#eaf3ff">AI 生成 SIP → 人工批准/修正</text>
    <text x="1097" y="268" text-anchor="middle" font-size="11.5" fill="#9cc2ee">定稿为现场检验依据，同步回存知识库</text>
  </g>
  <line x1="1097" y1="154" x2="1097" y2="213" stroke="#38bdf8" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#mL)"/>

  <!-- ===== 执行主链（现有·实线，透明描边） ===== -->
  <g font-size="14">
    <rect x="40" y="430" width="150" height="60" rx="10" fill="#0f2547" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="115" y="458" text-anchor="middle" font-weight="700" fill="#fff">供应商送货</text>
    <text x="115" y="478" text-anchor="middle" font-size="11.5" fill="#b9d4f2">来料 / 新物料NPI</text>

    <rect x="225" y="430" width="150" height="60" rx="10" fill="none" stroke="#6ea8e0" stroke-width="1.8"/>
    <text x="300" y="466" text-anchor="middle" font-weight="700" fill="#eaf3ff">仓库收料</text>

    <rect x="410" y="430" width="150" height="60" rx="10" fill="none" stroke="#6ea8e0" stroke-width="1.8"/>
    <text x="485" y="466" text-anchor="middle" font-weight="700" fill="#eaf3ff">来料登记</text>

    <!-- AI 智能派单（待接入·虚线，透明） -->
    <rect x="595" y="430" width="165" height="60" rx="10" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="8 5"/>
    <rect x="603" y="438" width="34" height="16" rx="8" fill="#0ea5e9"/><text x="620" y="450" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">AI</text>
    <text x="677" y="456" text-anchor="middle" font-weight="700" fill="#eaf3ff">AI 智能派单</text>
    <text x="677" y="478" text-anchor="middle" font-size="11.5" fill="#9cc2ee">按紧急度/资质自动分派检验员</text>

    <rect x="795" y="430" width="185" height="60" rx="10" fill="none" stroke="#6ea8e0" stroke-width="1.8"/>
    <rect x="801" y="436" width="30" height="15" rx="7.5" fill="#0ea5e9"/><text x="816" y="447" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fff">AI</text>
    <text x="892" y="456" text-anchor="middle" font-weight="700" fill="#eaf3ff">检验人员现场核对</text>
    <text x="887" y="478" text-anchor="middle" font-size="11.5" fill="#9cc2ee">实物+单据+检验要求 · AI核对</text>
  </g>
  <g stroke="#6ea8e0" stroke-width="2.4" fill="none">
    <line x1="190" y1="460" x2="223" y2="460" marker-end="url(#mB)"/>
    <line x1="375" y1="460" x2="408" y2="460" marker-end="url(#mB)"/>
    <line x1="560" y1="460" x2="593" y2="460" marker-end="url(#mB)"/>
    <line x1="760" y1="460" x2="793" y2="460" marker-end="url(#mB)"/>
  </g>

  <!-- 派单依据（含 MSA-AI，待接入·虚线，透明） -->
  <g font-size="12.5">
    <rect x="560" y="296" width="225" height="128" rx="10" fill="none" stroke="#7d99bd" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="672" y="320" text-anchor="middle" font-weight="700" fill="#cfe3f8">派单资源 / 规则（系统内）</text>
    <text x="672" y="344" text-anchor="middle" fill="#cfe3f8">用料紧急度</text>
    <rect x="586" y="359" width="30" height="15" rx="7.5" fill="#0ea5e9"/><text x="601" y="370" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fff">AI</text>
    <text x="624" y="368" text-anchor="start" fill="#cfe3f8">MSA 与来料资料核对</text>
    <text x="672" y="390" text-anchor="middle" fill="#0ea5e9" font-weight="700">AI 分析结论 → 生成改善建议</text>
    <text x="672" y="414" text-anchor="middle" fill="#cfe3f8">工具与校验状态</text>
  </g>
  <line x1="672" y1="424" x2="672" y2="428" stroke="#9cc2ee" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#mD)"/>

  <!-- 供应商管理主数据（透明） -->
  <g font-size="12.5">
    <rect x="40" y="300" width="200" height="102" rx="10" fill="none" stroke="#7d99bd" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="140" y="324" text-anchor="middle" font-weight="700" fill="#cfe3f8">供应商管理（主数据）</text>
    <text x="140" y="347" text-anchor="middle" fill="#cfe3f8">新物料 NPI 建档</text>
    <text x="140" y="369" text-anchor="middle" fill="#cfe3f8">物料供应 / 资质档案</text>
    <text x="140" y="391" text-anchor="middle" fill="#cfe3f8">供货表现记录</text>
  </g>
  <path d="M140,402 L115,428" stroke="#9cc2ee" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#mD)"/>
  <path d="M240,350 L300,148" stroke="#9cc2ee" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#mD)"/>

  <!-- SIP/SPC 供给现场（SPC-AI 改善建议） -->
  <path d="M1097,279 C1097,340 990,350 910,428" stroke="#38bdf8" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#mL)"/>
  <g font-size="12" fill="#7ec8ee" font-weight="600">
    <text x="792" y="356">供给：SIP · SPC</text>
    <rect x="898" y="348" width="30" height="15" rx="7.5" fill="#0ea5e9"/><text x="913" y="359" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fff">AI</text>
    <text x="938" y="356">·来料资料</text>
    <rect x="1006" y="348" width="30" height="15" rx="7.5" fill="#0ea5e9"/><text x="1021" y="359" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fff">AI</text>
    <text x="1046" y="356">·AI核对</text>
    <rect x="1098" y="348" width="30" height="15" rx="7.5" fill="#0ea5e9"/><text x="1113" y="359" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fff">AI</text>
    <text x="792" y="376" font-size="11" fill="#38bdf8" font-weight="700">AI 分析结论 → 生成改善建议</text>
  </g>

  <!-- 现场反馈 SIP 有问题 → 回 AI生成SIP 修订（反馈回路） -->
  <path d="M905,430 C905,330 1010,300 1060,281" stroke="#60a5fa" stroke-width="2" fill="none" stroke-dasharray="4 4" marker-end="url(#mL)"/>
  <text x="928" y="318" font-size="11.5" fill="#9cc2ee">现场反馈 SIP 有问题 → 回改</text>

  <!-- 判定菱形（透明） -->
  <polygon points="1080,428 1162,460 1080,492 998,460" fill="none" stroke="#6ea8e0" stroke-width="2"/>
  <text x="1080" y="456" text-anchor="middle" font-size="13.5" font-weight="700" fill="#eaf3ff">检验结果</text>
  <text x="1080" y="474" text-anchor="middle" font-size="12" fill="#9cc2ee">判定</text>
  <line x1="980" y1="460" x2="996" y2="460" stroke="#6ea8e0" stroke-width="2.4" marker-end="url(#mB)"/>

  <!-- OK 合格（实心深蓝） -->
  <g font-size="13.5">
    <rect x="930" y="580" width="180" height="58" rx="10" fill="#0f2547" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="1020" y="606" text-anchor="middle" font-weight="700" fill="#fff">OK 合格</text>
    <text x="1020" y="628" text-anchor="middle" font-size="12" fill="#b9d4f2">过站入库 · 正常放行</text>
  </g>
  <path d="M1068,492 C1050,530 1025,552 1020,578" stroke="#38bdf8" stroke-width="2.2" fill="none" marker-end="url(#mL)"/>
  <text x="978" y="536" font-size="12.5" font-weight="700" fill="#7ec8ee">OK</text>

  <!-- NG 组（透明） -->
  <g font-size="13">
    <rect x="1130" y="520" width="100" height="40" rx="8" fill="none" stroke="#7d99bd" stroke-width="1.6"/>
    <text x="1180" y="545" text-anchor="middle" font-weight="700" fill="#cfe3f8">NG 清单</text>
    <rect x="1130" y="584" width="100" height="40" rx="8" fill="none" stroke="#7d99bd" stroke-width="1.6"/>
    <text x="1180" y="602" text-anchor="middle" font-weight="700" fill="#cfe3f8">SCAR→供应商</text>
    <text x="1180" y="617" text-anchor="middle" font-size="10.5" fill="#9cc2ee">纠正措施要求</text>
    <!-- AI 8D（待接入·虚线，透明） -->
    <rect x="1130" y="648" width="100" height="40" rx="8" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="8 5"/>
    <rect x="1135" y="653" width="30" height="14" rx="7" fill="#0ea5e9"/><text x="1150" y="664" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">AI</text>
    <text x="1192" y="673" text-anchor="middle" font-weight="700" fill="#9cc2ee">AI 8D报告</text>
  </g>
  <!-- NG 处置顺序箭头：NG清单 → SCAR → AI8D -->
  <g stroke="#38bdf8" stroke-width="2" fill="none">
    <line x1="1180" y1="560" x2="1180" y2="582" marker-end="url(#mL)"/>
    <line x1="1180" y1="624" x2="1180" y2="646" marker-end="url(#mL)"/>
  </g>
  <path d="M1162,468 C1175,498 1180,506 1180,518" stroke="#38bdf8" stroke-width="2.2" fill="none" marker-end="url(#mL)"/>
  <text x="1168" y="500" font-size="12.5" font-weight="700" fill="#7ec8ee">NG</text>

  <!-- 回流1：8D/SCAR 经验 → 知识库（右侧） -->
  <path d="M1230,688 L1230,118 L1207,118" stroke="#38bdf8" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#mL)"/>
  <text x="1222" y="380" font-size="11.5" fill="#7ec8ee" font-weight="600" transform="rotate(90 1222,380)">8D/SCAR 经验沉淀回库</text>

  <!-- 后端反馈不良 + 回流2（透明） -->
  <g font-size="13">
    <rect x="40" y="830" width="200" height="62" rx="10" fill="none" stroke="#7d99bd" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="140" y="856" text-anchor="middle" font-weight="700" fill="#cfe3f8">后端反馈不良</text>
    <text x="140" y="878" text-anchor="middle" font-size="11.5" fill="#9cc2ee">产线/客户端后段暴露问题</text>
  </g>
  <path d="M240,861 C540,861 800,800 990,140" stroke="#38bdf8" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#mL)"/>
  <text x="470" y="832" font-size="12" fill="#7ec8ee" font-weight="600">不良案例回流，更新 SIP / 检验清单 / SPC（闭环）</text>

  <!-- 绩效考核（实心深蓝，含AI） -->
  <g font-size="13">
    <rect x="300" y="940" width="880" height="76" rx="12" fill="#0f2547" stroke="#38bdf8" stroke-width="1.8"/>
    <rect x="600" y="956" width="34" height="16" rx="8" fill="#0ea5e9"/><text x="617" y="968" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">AI</text>
    <text x="758" y="970" text-anchor="middle" font-weight="700" fill="#fff" font-size="15">IQC 绩效考核（AI 实时取数分析）</text>
    <text x="470" y="998" text-anchor="middle" fill="#b9d4f2">工作量：检验批次/数量</text>
    <text x="740" y="998" text-anchor="middle" fill="#b9d4f2">工作质量：后端分析(漏检/误判回溯)</text>
    <text x="1010" y="998" text-anchor="middle" fill="#b9d4f2">IQC 拦截：本环节拦下的不良</text>
  </g>
  <line x1="677" y1="490" x2="470" y2="938" stroke="#9cc2ee" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#mD)"/>
  <line x1="140" y1="892" x2="640" y2="938" stroke="#9cc2ee" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#mD)"/>
</svg>
</div>
</body>
</html>
