<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>检验员现场核对 · IQC</title>
<link rel="stylesheet" href="assets/demo.css">
<style>
  :root{
    --bg:#020617; --panel:#0f172a; --panel2:#1e293b; --line:rgba(255,255,255,.07);
    --blue:#3b82f6; --cyan:#06b6d4; --indigo:#6366f1; --glow:#60a5fa;
    --ok:#10b981; --warn:#f59e0b; --danger:#ef4444; --purple:#a78bfa;
    --txt:#e2e8f0; --mut:#94a3b8; --dim:#64748b;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--txt); font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif; font-size:14px; min-height:100vh;}
  .top{display:flex; align-items:center; justify-content:space-between; padding:14px 22px; border-bottom:1px solid var(--line); background:linear-gradient(180deg, rgba(59,130,246,.08), transparent);}
  .top h1{font-size:18px; font-weight:600; letter-spacing:.5px;}
  .top h1 em{color:var(--cyan); font-style:normal;}
  .top .sub{color:var(--mut); font-size:12px; margin-top:2px;}
  .top .right{display:flex; align-items:center; gap:12px;}
  .top .company{color:var(--cyan); font-size:13px;}
  .btn{padding:8px 16px; border:1px solid var(--line); border-radius:8px; background:var(--panel2); color:var(--txt); cursor:pointer; font-size:13px;}
  .btn:hover{border-color:var(--blue); color:var(--glow);}
  .btn.primary{background:linear-gradient(135deg, var(--blue), var(--indigo)); border:none; color:#fff; font-weight:600;}
  .btn.primary:disabled{opacity:.5; cursor:not-allowed;}
  .layout{display:flex; gap:16px; padding:16px 22px; align-items:flex-start;}
  .side{width:320px; flex:none;}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px;}
  .panel h3{font-size:13px; color:var(--mut); font-weight:600; margin-bottom:10px; letter-spacing:1px;}
  .task-list{max-height:75vh; overflow-y:auto;}
  .task{display:block; width:100%; text-align:left; padding:11px 12px; border:1px solid var(--line); border-radius:8px; background:var(--panel2); margin-bottom:8px; cursor:pointer;}
  .task:hover{border-color:var(--blue);}
  .task.sel{border-color:var(--cyan); box-shadow:0 0 12px rgba(6,182,212,.15);}
  .task .tn{font-weight:600; color:var(--cyan); font-size:13px;}
  .task .mn{color:var(--txt); font-size:13px; margin-top:3px;}
  .task .po{color:var(--dim); font-size:11px; margin-top:3px; display:flex; justify-content:space-between;}
  .task .pri{font-size:10px; padding:1px 6px; border-radius:8px; font-weight:600;}
  .task .pri.HIGH{background:rgba(239,68,68,.2); color:var(--danger);}
  .task .pri.NORMAL{background:rgba(148,163,184,.15); color:var(--mut);}
  .task .pri.LOW{background:rgba(16,185,129,.15); color:var(--ok);}
  .main{flex:1; min-width:0;}

  /* 来料任务信息条 */
  .task-info{background:var(--panel); border:1px solid rgba(6,182,212,.3); border-radius:10px; padding:12px 16px; margin-bottom:14px; display:flex; flex-wrap:wrap; gap:16px; align-items:center;}
  .task-info .ti{font-size:12px; color:var(--mut);}
  .task-info .ti b{color:var(--txt); font-weight:600; margin-left:4px;}
  .task-info .ti.tno{font-size:15px; color:var(--cyan); font-weight:700;}

  /* SIP 同款表格样式 */
  .sip-table{width:100%; border-collapse:collapse; font-size:12px; background:var(--panel); border-radius:10px; overflow:hidden;}
  .sip-table th{background:rgba(59,130,246,.15); color:var(--cyan); font-weight:700; padding:9px 8px; text-align:left; border:1px solid rgba(51,65,85,.6); font-size:11px; white-space:nowrap;}
  .sip-table td{border:1px solid rgba(51,65,85,.5); padding:9px 8px; vertical-align:middle; line-height:1.6;}
  .sip-table td.step{font-weight:700; color:#7dd3fc; white-space:nowrap; text-align:center;}
  .sip-table tr.row-ok{background:rgba(16,185,129,.06);}
  .sip-table tr.row-ng{background:rgba(239,68,68,.08);}
  tr.case-row td{background:rgba(239,68,68,.06); border-color:rgba(239,68,68,.3);}
  tr.case-row.t2 td{background:rgba(245,158,11,.05); border-color:rgba(245,158,11,.25);}
  .case-list{font-size:11px; line-height:1.8;}
  .case-list .ci{display:block; padding:2px 0;}
  .case-list .ci .tag{display:inline-block; font-size:10px; padding:1px 7px; border-radius:10px; font-weight:600; margin-right:6px;}
  .case-list .ci .tag.t1{background:var(--danger); color:#fff;}
  .case-list .ci .tag.t2{background:var(--warn); color:#0f172a;}
  .sample-inputs{display:flex; flex-wrap:wrap; gap:4px; align-items:center;}
  .sample-inputs input{width:52px; padding:5px 3px; background:var(--panel2); border:1px solid var(--line); border-radius:5px; color:var(--txt); font-size:12px; text-align:center;}
  .sample-inputs input:focus{outline:none; border-color:var(--blue);}
  .verdict{font-size:11px; font-weight:700; padding:2px 8px; border-radius:5px; display:inline-block; white-space:nowrap;}
  .verdict.ok{background:rgba(16,185,129,.18); color:var(--ok); border:1px solid rgba(16,185,129,.5);}
  .verdict.ng{background:rgba(239,68,68,.18); color:var(--danger); border:1px solid rgba(239,68,68,.5);}
  .verdict.na{background:rgba(148,163,184,.12); color:var(--mut); border:1px solid var(--line);}
  .seg{padding:4px 12px; border:1px solid var(--line); border-radius:6px; background:var(--panel2); color:var(--mut); cursor:pointer; font-size:12px;}
  .seg.on-OK{background:rgba(16,185,129,.18); border-color:rgba(16,185,129,.5); color:var(--ok); font-weight:600;}
  .seg.on-NG{background:rgba(239,68,68,.18); border-color:rgba(239,68,68,.5); color:var(--danger); font-weight:600;}
  .attach-ph{display:inline-flex; flex-direction:column; align-items:center; justify-content:center; width:48px; height:48px; border-radius:6px; border:1px dashed rgba(56,189,248,.4); background:rgba(56,189,248,.05); color:var(--cyan); cursor:pointer; font-size:9px; line-height:1.3;}
  .attach-ph:hover{background:rgba(56,189,248,.15);}
  .attach-none{color:var(--dim); font-size:11px;}
  .overall{margin-top:16px; padding:14px 18px; border-radius:12px; display:flex; align-items:center; justify-content:space-between; border:1px solid var(--line);}
  .excel-tool{display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap;}
  .excel-tool .btn{border-color:rgba(6,182,212,.4); color:var(--cyan);}
  .excel-tool .btn:hover{border-color:var(--cyan); background:rgba(6,182,212,.1);}
  .excel-hint{color:var(--dim); font-size:11px;}
  .overall.ng{background:rgba(239,68,68,.10); border-color:rgba(239,68,68,.5);}
  .overall.ok{background:rgba(16,185,129,.08); border-color:rgba(16,185,129,.4);}
  .overall .label{font-size:13px; color:var(--mut);}
  .overall .big{font-size:20px; font-weight:700;}
  .overall.ng .big{color:var(--danger);}
  .overall.ok .big{color:var(--ok);}
  .submit-row{margin-top:14px; display:flex; gap:10px; align-items:center;}
  .records{margin-top:18px;}
  .rec{display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 12px; margin-bottom:6px; font-size:12px; color:var(--mut);}
  .rec .v{padding:2px 8px; border-radius:6px; font-weight:600;}
  .rec .v.OK{background:rgba(16,185,129,.18); color:var(--ok);}
  .rec .v.NG{background:rgba(239,68,68,.18); color:var(--danger);}
  .toast{position:fixed; top:18px; right:18px; z-index:99; padding:12px 18px; border-radius:10px; font-size:13px; background:var(--panel2); border:1px solid var(--line); box-shadow:0 8px 30px rgba(0,0,0,.5); display:none;}
  .toast.ok{border-color:rgba(16,185,129,.5); color:var(--ok);}
  .toast.err{border-color:rgba(239,68,68,.5); color:var(--danger);}
  .gate{position:fixed; inset:0; background:rgba(2,6,23,.92); display:none; align-items:center; justify-content:center; z-index:100;}
  .gate .box{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:28px; width:340px;}
  .gate h2{font-size:17px; margin-bottom:16px;}
  .gate .f{margin-bottom:12px;}
  .gate .f label{display:block; font-size:12px; color:var(--mut); margin-bottom:4px;}
  .gate .f input{width:100%; padding:9px 11px; background:var(--panel2); border:1px solid var(--line); border-radius:8px; color:var(--txt);}
  .gate .err{color:var(--danger); font-size:12px; margin-bottom:8px; display:none;}
  .gate .btn{width:100%; margin-top:6px;}
  .empty{padding:30px; text-align:center; color:var(--dim); font-size:13px;}
  .spin{display:inline-block; width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--cyan); border-radius:50%; animation:r 1s linear infinite; vertical-align:-2px; margin-right:6px;}
  @keyframes r{to{transform:rotate(360deg);}}
  @media(max-width:900px){ .layout{flex-direction:column;} .side{width:100%;} }
</style>
<script src="assets/demo-auth.js"></script>
<script src="assets/demo-data.js"></script>
</head>
<body>
<div class=\"demo-banner\"><strong>演示数据，不写入服务器</strong></div>
<div class="top">
  <div>
    <h1>检验员现场核对 <em>· IQC Check</em></h1>
    <div class="sub">来料批次 → SIP逐项核对 · 自动判定 · 留痕记录</div>
  </div>
  <div class="right">
    <span class="company" id="companyName">—</span>
    <button class="btn" onclick="__iqcLogout()">退出登录</button>
  </div>
</div>

<div class="layout">
  <!-- 左侧：待检验来料任务清单 -->
  <div class="side panel">
    <h3>📥 待检验来料批次</h3>
    <div class="task-list" id="taskList"><div class="empty">加载中…</div></div>
  </div>

  <div class="main">
    <div id="detailEmpty" class="panel empty">← 请从左侧选择来料批次开始检验</div>

    <div id="detailArea" style="display:none;">
      <!-- 来料批次信息条 -->
      <div class="task-info" id="taskInfo"></div>

      <!-- Excel 批量导入工具条 -->
      <div class="excel-tool">
        <button class="btn" type="button" onclick="__demoExcelNotice()">⬇ 下载尺寸模板</button>
        <button class="btn" type="button" onclick="__demoExcelNotice()">📥 从 Excel 导入实测值</button>
        <span class="excel-hint">演示包使用内置示例行，不解析上传文件</span>
      </div>

      <!-- 检验项表格：与SIP同款列结构 + 结果列 + 附件列 -->
      <table class="sip-table">
        <thead>
          <tr>
            <th style="width:50px;">检验步骤</th>
            <th style="width:130px;">检验项目</th>
            <th>检验内容</th>
            <th style="width:70px;">检验方法</th>
            <th style="width:80px;">检验工具</th>
            <th style="width:100px;">检验频率</th>
            <th style="width:60px;">检验数量</th>
            <th>检验结果（实测值/附件）</th>
            <th style="width:100px;">判定结果</th>
          </tr>
        </thead>
        <tbody id="checkBody"></tbody>
      </table>

      <div class="overall" id="overallBar">
        <span class="label">总体判定（任一 NG 即不合格）</span>
        <span class="big" id="overallText">待核对</span>
      </div>

      <div class="submit-row">
        <button class="btn primary" id="submitBtn" onclick="__submit()">提交核对结果</button>
        <button class="btn" style="border-color:rgba(245,158,11,.5); color:var(--warn);" onclick="__reportSipIssue()">📝 SIP存疑上报</button>
        <span class="field" style="flex:none; min-width:0;"><input id="fRemark" placeholder="备注（可选）" style="width:280px;"></span>
      </div>

      <div class="records" id="recArea"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="gate" id="loginGate" style="display:none">
  <div class="box">
    <h2>检验员登录</h2>
    <div class="f"><label>公司代码</label><input id="lgCompany" value="DEMO"></div>
    <div class="f"><label>账号</label><input id="lgUser" placeholder="工号 / 用户名"></div>
    <div class="f"><label>密码</label><input id="lgPass" type="password" placeholder="密码"></div>
    <div class="err" id="loginErr"></div>
    <button class="btn primary" id="loginBtn" onclick="__iqcLogin()">登录</button>
  </div>
</div>

<script>
(function(){
  'use strict';
  var API = '';
var TOKEN = localStorage.getItem('iqc_token') || (DemoAuth.isFileProtocol() ? DemoAuth.DEMO_TOKEN : '');
  var state = { tasks: [], currentTask: null, currentProjectId: null, items: [], overall: 'NONE' };

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  (function showCompany(){
    try{ var u = JSON.parse(localStorage.getItem('qms_user') || '{}'); if(u.company_name) $('companyName').textContent = u.company_name; }catch(e){}
  })();

  function toast(msg, ok){
    var t = $('toast'); t.textContent = msg; t.className = 'toast ' + (ok ? 'ok' : 'err'); t.style.display = 'block';
    clearTimeout(t._h); t._h = setTimeout(function(){ t.style.display = 'none'; }, 3200);
  }

  function showLogin(msg){
    var g = $('loginGate'); g.style.display = 'flex';
    if(msg){ var e = $('loginErr'); e.textContent = msg; e.style.display = 'block'; }
  }
  function doLogin(){ location.href = 'login.html'; }
  window.__iqcLogin = doLogin;
  window.__iqcLogout = function(){ DemoAuth.logout(); };

  function apiGet(path){ return DemoAPI.get(path); }
  function apiPost(path, body){ return DemoAPI.post(path, body); }

  // ---------- 加载来料任务清单 ----------
  function loadTasks(){
    $('taskList').innerHTML = '<div class="empty"><span class="spin"></span>加载来料批次…</div>';
    apiGet('/iqc-agent/tasks?page_size=50').then(function(d){
      state.tasks = d.items || [];
      if(!state.tasks.length){ $('taskList').innerHTML = '<div class="empty">暂无待检验来料</div>'; return; }
      var h = '';
      state.tasks.forEach(function(t){
        h += '<div class="task" onclick="__openTask(' + t.id + ')">'
          + '<div class="tn">' + esc(t.task_no) + '</div>'
          + '<div class="mn">' + esc(t.material_code) + ' · ' + esc(t.material_name) + '</div>'
          + '<div class="po"><span>PO ' + esc(t.po_no || '—') + ' · ' + esc(t.received_qty) + 'pcs</span><span class="pri ' + esc(t.priority) + '">' + esc(t.priority) + '</span></div>'
          + '</div>';
      });
      $('taskList').innerHTML = h;
    }).catch(function(e){ $('taskList').innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>'; });
  }

  // ---------- 打开任务 → 找对应SIP项目 → 加载检验项 ----------
  function openTask(taskId){
    state.currentTask = state.tasks.find(function(t){ return t.id === taskId; }) || null;
    document.querySelectorAll('.task').forEach(function(n){ n.classList.remove('sel'); });
    if(state.currentTask){
      var all = Array.prototype.slice.call(document.querySelectorAll('.task'));
      var t = all.find(function(n){ return n.textContent.indexOf(state.currentTask.task_no) >= 0; });
      if(t) t.classList.add('sel');
    }
    if(!state.currentTask) return;

    // 显示任务信息条
    $('taskInfo').innerHTML = ''
      + '<span class="ti tno">' + esc(state.currentTask.task_no) + '</span>'
      + '<span class="ti">物料<b>' + esc(state.currentTask.material_code) + ' ' + esc(state.currentTask.material_name) + '</b></span>'
      + '<span class="ti">PO单号<b>' + esc(state.currentTask.po_no || '—') + '</b></span>'
      + '<span class="ti">来料数量<b>' + esc(state.currentTask.received_qty) + ' pcs</b></span>'
      + '<span class="ti">优先级<b>' + esc(state.currentTask.priority) + '</b></span>';

    $('detailEmpty').style.display = 'none';
    $('detailArea').style.display = 'block';

    // 按物料编码找对应的已批准SIP项目
    apiGet('/iqc-agent/projects?material_code=' + encodeURIComponent(state.currentTask.material_code) + '&status=ACTIVE&page_size=5').then(function(pd){
      var projects = pd.items || [];
      if(!projects.length){
        toast('物料 ' + state.currentTask.material_code + ' 暂无已批准SIP，无法检验', false);
        $('checkBody').innerHTML = '<tr><td colspan="9" class="empty">该物料尚未建立检验指导书（SIP），请先在「图纸→SIP工作台」生成并审批</td></tr>';
        return null;
      }
      state.currentProjectId = projects[0].id;
      var sid = state.currentTask.supplier_id ? '?supplier_id=' + state.currentTask.supplier_id : '';
      return apiGet('/iqc-agent/projects/' + state.currentProjectId + sid);
    }).then(function(d){
      if(d) renderDetail(d);
    }).catch(function(e){
      toast('加载检验项失败：' + e.message, false);
    });
  }

  // GB2828 II级 AQL=0.65 C=0 抽样数速查表
  function calcSampleByBatch(qty, freq, fixedSize){
    if(freq && freq.indexOf('全检') >= 0) return qty || 1;
    // 来料数量驱动：批量越大抽样越多
    if(!qty || qty <= 0) return fixedSize || 5;
    if(qty <= 50) return 5;
    if(qty <= 500) return 13;
    if(qty <= 3200) return 32;
    if(qty <= 10000) return 50;
    return 80;
  }

  function renderDetail(d){
    var batchQty = state.currentTask ? (state.currentTask.received_qty || 0) : 0;
    var items = (d.project_items || []).map(function(it, i){
      var sv = it.standard_value || '';
      var isDim = sv !== null && sv !== undefined && String(sv).trim() !== '' && /^[\d.]/.test(String(sv).trim());
      // 抽样数：
      // - 尺寸项/报告复核：按SIP写的固定数量
      // - 只有外观目视项（非尺寸、非报告复核）才按来料数量动态算AQL抽样数
      var freq = it.check_frequency || it.frequency || '每批';
      var toolStr = String(it.tool || '');
      var isReportItem = toolStr.indexOf('复核') >= 0;
      var sampleSize = parseInt(it.sample_size || '0', 10);
      if(isNaN(sampleSize) || sampleSize < 1){
        var m = String(it.sample_hint || '').match(/(\d+)/);
        sampleSize = m ? parseInt(m[1], 10) : 1;
      }
      // 只有外观目视项（不是尺寸、不是报告复核）才动态算
      if(!isDim && !isReportItem){
        sampleSize = calcSampleByBatch(batchQty, freq, sampleSize);
      }
      var toolStr2 = String(it.tool || '');
      var isReportItem2 = toolStr2.indexOf('复核') >= 0;
      // 默认OK规则：只有纯外观目视项默认OK；尺寸、案例、报告复核都待测
      var defaultVerdict = isDim ? null : (isReportItem2 ? null : 'OK');
      return {
        item_no: String(it.item_no != null ? it.item_no : (i + 1)),
        check_item: it.check_item || '',
        source_content: it.source_content || '',
        method: it.method || '',
        tool: it.tool || '',
        frequency: it.check_frequency || it.frequency || '抽检',
        sample_size: sampleSize,
        standard_value: sv,
        tolerance: it.tolerance || '',
        is_dim: isDim,
        measured_list: new Array(sampleSize).fill(''),
        verdict: defaultVerdict,
        is_case_row: false
      };
    });

    // 历史案例作为第一行
    var cases = d.cases || [];
    if(cases.length){
      var maxTier = 3;
      var caseContent = '';
      cases.forEach(function(c){
        var t = c.tier === 1 ? 1 : (c.tier === 2 ? 2 : 3);
        if(t < maxTier) maxTier = t;
        var lab = t === 1 ? '重点' : (t === 2 ? '同物料' : '参考');
        caseContent += '<span class="ci"><span class="tag t' + t + '">' + lab + '</span>' + esc(c.symptom || c.defect_type || '') + '</span>';
      });
      items.unshift({
        item_no: '0',
        check_item: '⚠ 历史不良案例核对',
        source_content_html: '<div class="case-list">' + caseContent + '</div>',
        method: '目视对照+留档', tool: '📎上传附件', frequency: '每批', sample_size: 1,
        standard_value: '', tolerance: '', is_dim: false,
        measured_list: [''], verdict: null, is_case_row: true, case_tier: maxTier
      });
    }
    state.items = items;

    // 渲染表格
    var rh = '';
    state.items.forEach(function(it, idx){
      var rowCls = it.is_case_row ? 'case-row' + (it.case_tier === 2 ? ' t2' : '') : '';
      var stdText = it.is_case_row ? '' : (it.is_dim ? ('标准 ' + esc(it.standard_value) + ' ' + esc(it.tolerance)) : esc(it.source_content || it.standard_value || '—'));
      rh += '<tr class="' + rowCls + '" id="row-' + idx + '">'
        + '<td class="step">' + esc(it.item_no) + '</td>'
        + '<td><b>' + esc(it.check_item) + '</b></td>';
      if(it.is_case_row){ rh += '<td>' + (it.source_content_html || '') + '</td>'; }
      else { rh += '<td>' + stdText + '</td>'; }
      rh += '<td>' + esc(it.method || '—') + '</td>'
        + '<td>' + esc(it.tool || '—') + '</td>'
        + '<td>' + esc(it.frequency) + '</td>'
        + '<td>' + it.sample_size + '</td>';
      var needAttach = it.is_case_row || (it.tool && it.tool.indexOf('复核供应商') >= 0);
      if(it.is_dim){
        // 尺寸项：检验结果列放输入框，判定结果列放自动徽章
        var inpHtml = '<div class="sample-inputs">';
        for(var s = 0; s < it.sample_size; s++){
          inpHtml += '<input type="number" step="any" placeholder="#' + (s+1) + '" oninput="__dimSample(' + idx + ',' + s + ', this.value)">';
        }
        inpHtml += '</div>';
        rh += '<td>' + inpHtml + '</td>';
        rh += '<td style="text-align:center;"><span class="verdict na" id="vd-' + idx + '">待测</span></td>';
      } else if(it.is_case_row){
        // 历史案例行：OK/NG 双按钮 + 附件必传（拍照留痕）；NG 时说明哪个案例再现
        var cokCls = it.verdict === 'OK' ? ' on-OK' : '';
        var cngCls = it.verdict === 'NG' ? ' on-NG' : '';
        var attachHtml2 = it.has_attach
          ? '<span class="attach-ph" style="color:var(--ok);" onclick="__pickAttach(' + idx + ')">✅<br>' + esc(it.attach_name || '已上传') + '</span>'
          : '<span class="attach-ph" onclick="__pickAttach(' + idx + ')">📎<br>拍照上传</span>';
        attachHtml2 += '<input type="file" id="file-' + idx + '" style="display:none;" onchange="__filePicked(' + idx + ', this)">';
        rh += '<td style="text-align:center;"><div style="display:flex;gap:6px;align-items:center;justify-content:center;">'
          + '<button class="seg' + cokCls + '" id="seg-' + idx + '-OK" onclick="__judgeCase(' + idx + ',\'OK\')">OK 无异常</button>'
          + '<button class="seg' + cngCls + '" id="seg-' + idx + '-NG" onclick="__judgeCase(' + idx + ',\'NG\')">NG 问题再现</button></div>'
          + '<div style="margin-top:6px;">' + attachHtml2 + '</div></td>';
        var cvCls = it.verdict === 'OK' ? 'ok' : (it.verdict === 'NG' ? 'ng' : 'na');
        rh += '<td style="text-align:center;"><span class="verdict ' + cvCls + '" id="vd-' + idx + '">' + (it.verdict || '待测') + '</span></td>';
      } else if(it.tool && it.tool.indexOf('复核供应商') >= 0){
        // 报告复核行（材质/环保）：上传附件即OK
        var attachHtml = it.has_attach
          ? '<span class="attach-ph" style="color:var(--ok);" onclick="__pickAttach(' + idx + ')">✅<br>' + esc(it.attach_name || '已上传') + '</span>'
          : '<span class="attach-ph" onclick="__pickAttach(' + idx + ')">📎<br>上传附件</span>';
        attachHtml += '<input type="file" id="file-' + idx + '" style="display:none;" onchange="__filePicked(' + idx + ', this)">';
        rh += '<td style="text-align:center;">' + attachHtml + '</td>';
        var vCls2 = it.verdict === 'OK' ? 'ok' : (it.verdict === 'NG' ? 'ng' : 'na');
        rh += '<td style="text-align:center;"><span class="verdict ' + vCls2 + '" id="vd-' + idx + '">' + (it.verdict || '待测') + '</span></td>';
      } else {
        // 外观目视项：检验结果列放OK/NG按钮（默认OK）
        var okCls = it.verdict === 'OK' ? ' on-OK' : '';
        var ngCls = it.verdict === 'NG' ? ' on-NG' : '';
        var vCls = it.verdict === 'OK' ? 'ok' : (it.verdict === 'NG' ? 'ng' : 'na');
        rh += '<td><div style="display:flex;gap:6px;align-items:center;">'
          + '<button class="seg' + okCls + '" id="seg-' + idx + '-OK" onclick="__judge(' + idx + ',\'OK\')">OK</button>'
          + '<button class="seg' + ngCls + '" id="seg-' + idx + '-NG" onclick="__judge(' + idx + ',\'NG\')">NG</button></div></td>';
        rh += '<td style="text-align:center;"><span class="verdict ' + vCls + '" id="vd-' + idx + '">' + (it.verdict || '待测') + '</span></td>';
      }
      rh += '</tr>';
    });
    $('checkBody').innerHTML = rh;

    // 最近记录
    var recs = d.recent_records || [];
    if(recs.length){
      var rh2 = '';
      recs.forEach(function(r){
        rh2 += '<div class="rec"><span class="v ' + esc(r.overall_verdict) + '">' + esc(r.overall_verdict) + '</span>'
          + '<span>批次 ' + esc(r.batch_no || '—') + '</span>'
          + '<span style="margin-left:auto;">' + esc(String(r.created_at || '').slice(0, 16).replace('T', ' ')) + '</span></div>';
      });
      $('recArea').innerHTML = '<div style="font-size:13px;color:var(--cyan);font-weight:600;margin:16px 0 8px;">最近核对记录</div>' + rh2;
    } else { $('recArea').innerHTML = ''; }
    recompute();
  }

  function judgeDimItem(it){
    var sv = parseFloat(it.standard_value);
    var tolRaw = String(it.tolerance || '').replace(/±|\+\/-/g, '').trim();
    var tol = tolRaw === '' ? NaN : parseFloat(tolRaw);
    if(isNaN(sv) || isNaN(tol)) return null;
    var hasAny = false;
    for(var i = 0; i < it.measured_list.length; i++){
      var v = String(it.measured_list[i] || '').trim();
      if(v === '') continue;
      hasAny = true;
      var mv = parseFloat(v);
      if(isNaN(mv)) continue;
      if(mv < sv - tol || mv > sv + tol) return 'NG';
    }
    return hasAny ? 'OK' : null;
  }
  window.__dimSample = function(idx, sampleIdx, val){
    var it = state.items[idx]; if(!it) return;
    it.measured_list[sampleIdx] = val;
    it.verdict = judgeDimItem(it);
    updateRow(idx, it.verdict); recompute();
  };
  window.__judge = function(idx, v){
    var it = state.items[idx]; if(!it) return;
    it.verdict = v;
    ['OK','NG'].forEach(function(k){
      var s = $('seg-' + idx + '-' + k);
      if(s){ s.className = 'seg' + (k === v ? ' on-' + k : ''); }
    });
    updateRow(idx, v); recompute();
  };
  // 历史案例行判定：NG 时记录哪个案例问题再现（随提交留痕给 QE）
  window.__judgeCase = function(idx, v){
    var it = state.items[idx]; if(!it) return;
    if(v === 'NG'){
      var d = prompt('请说明：哪个历史案例的问题在本批再现？（随记录留痕给QE）', it.case_tier === 1 ? '重点案例问题再现' : '历史案例问题再现');
      if(d === null) return;
      it.case_ng_note = String(d).trim() || '案例问题再现';
    } else {
      it.case_ng_note = '';
    }
    it.verdict = v;
    ['OK','NG'].forEach(function(k){
      var s = $('seg-' + idx + '-' + k);
      if(s){ s.className = 'seg' + (k === v ? ' on-' + k : ''); }
    });
    updateRow(idx, v); recompute();
  };
  function updateRow(idx, v){
    var el = $('vd-' + idx);
    if(el){
      el.className = 'verdict ' + (v === 'OK' ? 'ok' : (v === 'NG' ? 'ng' : 'na'));
      el.textContent = v === 'OK' ? 'OK' : (v === 'NG' ? 'NG' : '待测');
    }
    var row = $('row-' + idx);
    if(row){ row.classList.remove('row-ok','row-ng'); if(v === 'OK') row.classList.add('row-ok'); if(v === 'NG') row.classList.add('row-ng'); }
  }
  function recompute(){
    var anyNg = state.items.some(function(x){ return x.verdict === 'NG'; });
    var allDone = state.items.length > 0 && state.items.every(function(x){ return x.verdict !== null; });
    state.overall = anyNg ? 'NG' : (allDone ? 'OK' : 'NONE');
    var bar = $('overallBar');
    bar.className = 'overall ' + (state.overall === 'NG' ? 'ng' : (state.overall === 'OK' ? 'ok' : ''));
    var t = $('overallText');
    if(state.overall === 'NG') t.textContent = 'NG · 不合格';
    else if(state.overall === 'OK') t.textContent = 'OK · 合格';
    else t.textContent = '待核对（' + state.items.filter(function(x){ return x.verdict !== null; }).length + '/' + state.items.length + '）';
    $('submitBtn').disabled = state.overall === 'NONE';
  }

  window.__submit = function(){
    // 防呆：需要上传附件的行必须传了才能提交
    var missing = [];
    state.items.forEach(function(it, idx){
      var needAttach = it.is_case_row || (it.tool && it.tool.indexOf('复核供应商') >= 0);
      if(needAttach && !it.has_attach){
        missing.push(it.check_item || ('第' + it.item_no + '项'));
      }
    });
    if(missing.length){
      toast('⚠️ 以下项必须上传附件才能提交：' + missing.join('、'), false);
      return;
    }
    var pid = state.currentProjectId;
    var payload = {
      batch_no: state.currentTask.task_no,
      supplier_id: state.currentTask.supplier_id || null,
      items: state.items.map(function(x){
        var rmk = x.remark || '';
        if(x.is_case_row && x.case_ng_note){ rmk = (rmk ? rmk + ' | ' : '') + '【案例再现】' + x.case_ng_note; }
        return { item_no: x.item_no, measured_value: x.is_dim ? x.measured_list.join(',') : '', verdict: x.verdict, remark: rmk };
      }),
      overall_verdict: state.overall,
      remark: $('fRemark').value.trim()
    };
    var btn = $('submitBtn');
    btn.disabled = true; btn.textContent = '提交中…';
    apiPost('/iqc-agent/projects/' + pid + '/check', payload).then(function(res){
      toast('核对已提交：总体 ' + res.overall_verdict + '，不合格 ' + res.ng_count + '/' + res.total + ' 项，记录号 ' + res.record_id, res.overall_verdict === 'OK');
      var sid2 = state.currentTask && state.currentTask.supplier_id ? '?supplier_id=' + state.currentTask.supplier_id : '';
      apiGet('/iqc-agent/projects/' + pid + sid2).then(renderDetail).catch(function(){});
    }).catch(function(e){ toast('提交失败：' + e.message, false); })
      .finally(function(){ btn.disabled = state.overall === 'NONE'; btn.textContent = '提交核对结果'; });
  };

  window.__openTask = function(id){ openTask(id); };

  // 上传附件功能
  window.__pickAttach = function(idx){
    document.getElementById('file-' + idx).click();
  };
  window.__filePicked = function(idx, input){
    if(!input.files || !input.files[0]) return;
    var f = input.files[0];
    state.items[idx].has_attach = true;
    state.items[idx].attach_name = f.name;
    // 案例行：附件只是拍照留痕，判定由 OK/NG 按钮决定；报告复核行：传了附件即视为 OK
    if(!state.items[idx].is_case_row && !state.items[idx].verdict){
      state.items[idx].verdict = 'OK';
      var el = document.getElementById('vd-' + idx);
      if(el){ el.className = 'verdict ok'; el.textContent = 'OK'; }
      recompute();
    }
    toast('附件已上传：' + f.name, true);
  };

  // SIP存疑上报：简单弹框记录，随提交一起留痕
  window.__reportSipIssue = function(){
    var txt = prompt('请描述SIP存在的问题（如：缺尺寸/标准错/工具不对）：');
    if(!txt || !txt.trim()) return;
    var existing = $('fRemark').value.trim();
    $('fRemark').value = (existing ? existing + ' | ' : '') + '【SIP存疑】' + txt.trim();
    toast('已记录SIP问题，提交后随记录留痕给QE', true);
  };

  window.__demoExcelNotice = function(){ toast(DemoAPI.excelNotice, true); };
  window.__dlTemplate = window.__demoExcelNotice;
  window.__pickExcel = window.__demoExcelNotice;
    rd.readAsArrayBuffer(f);
    input.value = '';
  };

  function _dimName(d){ return String(d.check_item).replace(/^\d+、尺寸检验·/, '').trim(); }
  function _normHead(h){ return String(h).replace(/^\d+[、.]?\s*/, '').trim(); }
  function _sameDim(a, b){
    if(!a || !b) return false;
    if(a === b) return true;
    if(a.indexOf(b) >= 0 || b.indexOf(a) >= 0) return true;
    if(a.indexOf('±') >= 0 && b.indexOf('±') >= 0 && (a.indexOf('±') === b.indexOf('±') || a.split('±')[0].trim() === b.split('±')[0].trim())) return true;
    return false;
  }

  function applyExcel(aoa){
    var dims = state.items.filter(function(x){ return x.is_dim; });
    if(!dims.length){ toast('当前 SIP 没有尺寸项', false); return; }
    var rows = aoa.filter(function(r){ return r.some(function(c){ return String(c).trim() !== ''; }); });
    if(rows.length < 2){ toast('Excel 内容为空', false); return; }
    var header = rows[0].map(function(c){ return String(c).trim(); });

    // 格式A（模板回填）：表头含尺寸项名，列=尺寸项、行=件号
    var dimCols = [];
    header.forEach(function(h, ci){
      var hn = _normHead(h);
      if(!hn || hn === '序号' || hn === '尺寸项' || hn === '标准值' || hn === '公差' || hn === '单位') return;
      dims.forEach(function(d){
        if(!dimCols.some(function(m){ return m.dim === d; }) && _sameDim(hn, _dimName(d))){
          dimCols.push({ dim: d, col: ci });
        }
      });
    });

    // 格式B（横向多件）：表头含"第N件/N"，行=尺寸项、列=件号
    var pieceCols = [];
    header.forEach(function(h, ci){
      if(/^第?\s*\d+\s*件?$/.test(h) || /^件\d+$/.test(h)) pieceCols.push(ci);
    });
    var dimRows = [];
    if(pieceCols.length){
      for(var ri = 1; ri < rows.length; ri++){
        var row = rows[ri];
        // 尺寸名 = 行内第一个"非纯数字、非单位"的文字单元格（模板里是 B 列 ①；用户表里可能是 A 列 ①50.5±0.3）
        var nameCell = '';
        for(var ci = 0; ci < row.length; ci++){
          var cc = String(row[ci] != null ? row[ci] : '').trim();
          if(cc && cc !== 'mm' && !/^\d+(\.\d+)?$/.test(cc)){
            nameCell = cc; break;
          }
        }
        if(!nameCell) continue;
        dimRows.push({ name: _normHead(nameCell), vals: pieceCols.map(function(ci){ return String(row[ci] != null ? row[ci] : '').trim(); }) });
      }
    }

    var filled = 0, ng = 0, extraWarn = [];
    function fillOne(dim, vals){
      if(!vals.length) return;
      var idx = state.items.indexOf(dim);
      if(vals.length > dim.sample_size){
        extraWarn.push(_dimName(dim) + '(' + vals.length + '>抽' + dim.sample_size + ')');
      }
      for(var i = 0; i < dim.sample_size && i < vals.length; i++){
        dim.measured_list[i] = vals[i];
        __dimSample(idx, i, vals[i]);
        // 回填输入框显示（导入的数值让检验员可见）
        var tr = document.querySelectorAll('#checkBody tr')[idx];
        if(tr){
          var ins = tr.querySelectorAll('.sample-inputs input');
          if(ins[i]) ins[i].value = vals[i];
        }
      }
      filled++;
      if(dim.verdict === 'NG') ng++;
    }
    function splitVals(v){
      if(v === '' || v == null) return [];
      var s = String(v).trim();
      if(s.indexOf(',') >= 0 || s.indexOf('，') >= 0 || s.indexOf(';') >= 0 || s.indexOf('；') >= 0){
        return String(s).split(/[,，;；]/).map(function(x){ return x.trim(); }).filter(function(x){ return x !== ''; });
      }
      return [s];
    }

    if(dimRows.length){
      // 格式B：行=尺寸项
      var usedRows = {};
      dims.forEach(function(d){
        var dn = _dimName(d);
        var hit = null;
        for(var k = 0; k < dimRows.length; k++){
          if(!usedRows[k] && _sameDim(dimRows[k].name, dn)){ hit = dimRows[k]; usedRows[k] = true; break; }
        }
        // 顺序兜底：行数恰好=尺寸数时，按行顺序对应（表头无名称也能导入）
        if(!hit && dimRows.length === dims.length){
          var idx = dims.indexOf(d);
          if(dimRows[idx]) hit = dimRows[idx];
        }
        if(!hit) return;
        var vals = [];
        hit.vals.forEach(function(v){ vals = vals.concat(splitVals(v)); });
        fillOne(d, vals);
      });
    } else if(dimCols.length){
      // 格式A：列=尺寸项
      dimCols.forEach(function(m){
        var vals = [];
        for(var ri = 1; ri < rows.length; ri++){
          var v = String(rows[ri][m.col] != null ? rows[ri][m.col] : '').trim();
          vals = vals.concat(splitVals(v));
        }
        fillOne(m.dim, vals);
      });
    } else {
      toast('没识别出尺寸列：请用下载的模板格式，或表头带尺寸项名称（如 ①50.5±0.3、尺寸1）', false);
      return;
    }

    if(filled){
      recompute();
      var wmsg = extraWarn.length ? '；注意：' + extraWarn.slice(0, 2).join('、') + ' 超出抽样件数已忽略多余值' : '';
      toast('导入完成：' + filled + ' 个尺寸项、' + countFilled() + ' 个实测值，其中 ' + ng + ' 个判 NG（超差）' + wmsg, ng ? false : true);
    } else {
      toast('没有匹配到任何尺寸项，请核对 Excel 表头与尺寸名称', false);
    }
  }

  function countFilled(){
    var n = 0;
    state.items.forEach(function(x){ if(x.is_dim){ x.measured_list.forEach(function(v){ if(String(v).trim() !== '') n++; }); } });
    return n;
  }

  function init(){
    if(!DemoAuth.requireDemoAuth()){ return; }
    var g = document.getElementById('loginGate'); if (g) g.style.display = 'none';
    apiGet('/iqc-agent/tasks?page_size=1').then(function(){ loadTasks(); })
      .catch(function(e){ if(String(e.message).indexOf('401') >= 0) showLogin(); else { toast(e.message, false); loadTasks(); } });
  }
  init();
})();
</script>
