<head>

    <!-- STREAMING_CHUNK:Loading Tailwind CSS and Fonts -->
<!-- STREAMING_CHUNK:Defining CSS Variables and Base Styles -->
    <style>
        :root {
            --bg-deep: #040b14;
            --accent-cyan: #38bdf8;
            --accent-blue: #3b82f6;
            --panel-bg: rgba(10, 25, 47, 0.75);
            --panel-border: rgba(56, 189, 248, 0.25);
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: var(--bg-deep);
            color: #e2e8f0;
            overflow: hidden; /* Hide scrollbars for cinematic full-screen */
        }

        .font-tech {
            font-family: 'Rajdhani', sans-serif;
        }

        /* STREAMING_CHUNK:Styling Cinematic Background Elements */
        .cinematic-bg {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 15% 30%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 70%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
                linear-gradient(180deg, #020617 0%, #0f172a 100%);
            z-index: -3; /* Moved further back */
        }

        .grid-overlay {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(56, 189, 248, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -2; /* Moved further back */
            opacity: 0.6;
            mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
            -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
        }

        /* STREAMING_CHUNK:Styling Credits Wrapper — moved to LEFT side per annotation */
        .credits-wrapper {
            position: absolute;
            /* Position on the LEFT side of the screen */
            left: 3%;
            top: 0;
            width: 24%;
            max-width: 320px;
            height: 100vh;
            overflow: hidden;
            pointer-events: none;
            /* Faded edges top and bottom */
            mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
            /* z-index is crucial: behind main content (z-10) but above deep background */
            z-index: 1;
            opacity: 0.4; /* Make it subtle so it doesn't distract from the foreground */
        }

        .credits-track {
            display: flex;
            flex-direction: column;
            width: 100%;
            /* Slower animation since it's in the background now */
            animation: scrollCredits 60s linear infinite;
        }

        @keyframes scrollCredits {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); }
        }

        /* STREAMING_CHUNK:Styling Individual Credit Blocks with Reduced Font Sizes */
        .credit-block {
            padding: 1rem 1.5rem;
            /* Center text alignment for background aesthetics */
            text-align: center;
        }

        .credit-role {
            font-size: 0.6rem; /* Reduced from 0.75rem */
            color: #7dd3fc;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin-bottom: 0.2rem;
            opacity: 0.7;
            font-weight: 500;
        }

        .credit-name {
            font-size: 1rem; /* Reduced from 1.3rem */
            font-weight: 400;
            color: #f8fafc;
            letter-spacing: 0.1em;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.2);
            opacity: 0.8;
        }

        .credit-desc {
            font-size: 0.65rem; /* Reduced from 0.78rem */
            color: #94a3b8;
            margin-top: 0.2rem;
            line-height: 1.4;
            max-width: 90%;
            margin-left: auto;
            margin-right: auto;
            opacity: 0.6;
        }

        /* STREAMING_CHUNK:Styling the Glass Panel (Main Container) */
        .glass-panel {
            background: var(--panel-bg);
            /* Slightly increased blur to separate from background text */
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--panel-border);
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.8), inset 0 0 25px rgba(56, 189, 248, 0.08);
        }

        /* STREAMING_CHUNK:Styling Input Fields */
        .input-glow {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(100, 116, 139, 0.4);
            color: #f8fafc;
            transition: all 0.3s ease;
        }

        .input-glow:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
            background: rgba(15, 23, 42, 0.85);
        }

        /* STREAMING_CHUNK:Styling Cyberpunk Button */
        .btn-cyber {
            background: linear-gradient(135deg, var(--accent-blue), #0284c7);
            border: 1px solid #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-cyber::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 20%;
            height: 200%;
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(30deg);
            transition: all 0.6s ease;
        }

        .btn-cyber:hover::after {
            left: 120%;
        }

        .btn-cyber:hover {
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.6);
            transform: translateY(-1px);
        }

        /* STREAMING_CHUNK:Styling Process Chain Progress Indicator */
        .process-chain {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 1.2rem;
            position: relative;
        }

        .process-line-bg {
            position: absolute;
            top: 50%;
            left: 10px;
            right: 10px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.4), transparent);
            z-index: 0;
        }

        .process-node {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.35rem;
        }

        .node-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #1e293b;
            border: 1px solid #475569;
            transition: all 0.3s ease;
        }

        .node-label {
            font-size: 0.6rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .process-node:hover .node-dot,
        .process-node.active .node-dot {
            background: var(--accent-cyan);
            border-color: #fff;
            box-shadow: 0 0 10px var(--accent-cyan);
        }

        .process-node:hover .node-label,
        .process-node.active .node-label {
            color: #e0f2fe;
            font-weight: 500;
        }

        /* STREAMING_CHUNK:Adding Fade-in Animation */
        .fade-in-up {
            animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
<script src="assets/demo-auth.js"></script>

        // Populate rolling credits with seamless double-buffering for infinite loop
        function initializeCredits() {
            const track = document.getElementById('creditsTrack');
            let htmlStr = '';

            projectTeam.forEach(member => {
                htmlStr += `
                    <div class="credit-block">
                        <div class="credit-role">${member.role}</div>
                        <div class="credit-name">${member.name}</div>
                        <div class="credit-desc">${member.desc}</div>
                    </div>
                `;
            });

            // Duplicate exact array to achieve continuous seamless loop
            track.innerHTML = htmlStr + htmlStr + htmlStr;
        }

        function handleLogin(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalContent = btn.innerHTML;
            const errBox = document.getElementById('loginError');
            const company = (document.getElementById('loginCompany').value || '').trim() || 'DEMO';
            const id = (document.getElementById('loginId').value || '').trim();
            const pw = document.getElementById('loginPw').value || '';
            errBox.classList.add('hidden');

            if (!id || !pw) {
                errBox.textContent = '请输入工号和密码';
                errBox.classList.remove('hidden');
                return;
            }

            btn.innerHTML = '正在进入演示…';
            btn.style.opacity = '0.85';
            btn.style.cursor = 'wait';

            var user = {
                username: id,
                full_name: '[姓名]',
                role: 'quality_engineer',
                company_code: company,
                company_name: '[公司]',
                employee_no: id
            };
            DemoAuth.writeSession(user);

            btn.innerHTML = '验证通过 - 载入智能体协同中枢';
            btn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
            btn.style.borderColor = '#34d399';
            btn.style.boxShadow = '0 0 25px rgba(16, 185, 129, 0.4)';

            const nodes = document.querySelectorAll('.process-node');
            nodes.forEach((node, index) => {
                setTimeout(() => {
                    node.classList.add('active');
                }, index * 180);
            });

            setTimeout(() => {
                window.location.href = './dashboard.html';
            }, 600);
        }

        function showResetNotice(e) {
            e.preventDefault();
            alert("请联系系统管理员申请演示账号");
        }

        window.onload = () => {
            initializeCredits();
        };
